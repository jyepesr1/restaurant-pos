<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>POS</title>
    <link rel="icon" href="/marca/la-spritzzeria.svg" />
    <script>
      // Modo oscuro antes de pintar: sin destello blanco en el bar de noche (ver src/ui/tema.ts).
      try {
        // Marca (src/ui/marca.ts): neutra salvo que se haya elegido otra.
        const m = localStorage.getItem('pos-marca') || 'neutra'
        if (m !== 'neutra') document.documentElement.dataset.marca = m
      } catch {}
      try {
        const t = localStorage.getItem('pos-tema')
        if (t === 'oscuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('oscuro')
      } catch {}
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
